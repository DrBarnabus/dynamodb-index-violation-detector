name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: dynamodb-violation-detector

jobs:
  ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - if: github.ref_type == 'tag'
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate. Bump Cargo.toml or retag as v$crate."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, exe: .exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          name="$BIN-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md "target/${{ matrix.target }}/release/$BIN${{ matrix.exe }}" "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.BIN }}-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [ci, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
          --prerelease=${{ contains(github.ref_name, '-') }}
