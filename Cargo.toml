[package]
name = "dynamodb-violation-detector"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = "0.1.92"
aws-config = "1.8.18"
aws-sdk-dynamodb = "1.116.0"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"

[dev-dependencies]
criterion = "0.8.2"
testcontainers = "0.28.0"
tokio = { version = "1.52.3", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
bench = false

[[bin]]
name = "dynamodb-violation-detector"
bench = false

[[bench]]
name = "rules"
harness = false

[[bench]]
name = "export"
harness = false
